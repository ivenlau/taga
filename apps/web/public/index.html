<!doctype html>

    <div class="main">

        <div class="topbar-title">
          <h1 id="page-title">概览</h1>
          <div class="crumb" id="page-crumb">brain / 总览</div>
        </div>
        <div class="spacer"></div>
        <div class="top-search">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>

            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
          </button>
        </div>
        <div class="theme-dd" id="theme-dd">

            <span class="swatch" id="theme-dd-swatch"></span>
            <span id="theme-dd-label">主题</span>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
